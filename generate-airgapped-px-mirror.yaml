---
- name: Generate Portworx px-versions ConfigMap and oc-mirror ImageSetConfiguration
  hosts: localhost
  gather_facts: false
  vars:
    px_version: "3.6.1"
    kbver: "1.32.7"
    opver: "26.2.0"
    namespace: "portworx"
    configmap_name: "px-versions"
    configmap_out: "{{ playbook_dir }}/px-versions-configmap.yaml"
    imageset_out: "{{ playbook_dir }}/image-set-configuration.yaml"
    imageset_api_version: "mirror.openshift.io/v2alpha1"
    # Optional category names to include beyond the default set.
    # Example: -e '{"categories":["monitoring","cert-manager"]}'
    categories: []
    component_categories:
      default:
        - stork
        - clusterDiags
        - csiPlugin
        - csiMigrator
        - csiLivenessProbe
        - csiNodeDriverRegistrar
        - csiProvisioner
        - csiAttacher
        - csiResizer
        - csiSnapshotter
        - csiSnapshotController
        - pxLibUpdate
        - kubeScheduler
        - kubeControllerManager
        - pause
      autopilot:
        - autopilot
      telemetry:
        - csiTelemetry
        - telemetry
        - metricsCollector
        - telemetryProxy
        - logUploader
      monitoring:
        - prometheus
        - prometheusOperator
        - prometheusConfigReloader
        - alertManager
      px-cache:
        - cacheAgent
      fusion:
        - integrationOperator
        - fusionController
      ocp-console-plugin:
        - dynamicPlugin
        - dynamicPluginProxy
      cert-manager:
        - certManagerController
        - certManagerWebhook
        - certManagerCaInjector
        - certManagerAcmeSolver

  tasks:
    - name: Validate requested categories exist
      ansible.builtin.fail:
        msg: "Unknown category '{{ item }}'. Valid: {{ component_categories.keys() | list }}"
      loop: "{{ categories }}"
      when: item not in component_categories

    - name: Compute selected category list (default always included)
      ansible.builtin.set_fact:
        selected_categories: "{{ (['default'] + categories) | unique }}"

    - name: Compute selected component keys
      ansible.builtin.set_fact:
        selected_components: >-
          {{
            selected_categories
            | map('extract', component_categories)
            | flatten
            | unique
          }}

    - name: Fetch Portworx version manifest
      ansible.builtin.uri:
        url: "https://install.portworx.com/{{ px_version }}/version?kbver={{ kbver }}&opver={{ opver }}"
        return_content: true
        status_code: 200
      register: px_manifest_response

    - name: Parse upstream manifest
      ansible.builtin.set_fact:
        px_manifest: "{{ px_manifest_response.content | from_yaml }}"

    - name: Warn on components in manifest not in any category
      ansible.builtin.debug:
        msg: "Uncategorized components present in upstream manifest: {{ uncategorized }}"
      vars:
        all_known: "{{ component_categories.values() | flatten }}"
        uncategorized: "{{ px_manifest.components.keys() | difference(all_known) }}"
      when: uncategorized | length > 0

    - name: Build filtered components dict
      ansible.builtin.set_fact:
        filtered_components: >-
          {{
            dict(
              (selected_components | intersect(px_manifest.components.keys() | list))
              | zip(
                  (selected_components | intersect(px_manifest.components.keys() | list))
                  | map('extract', px_manifest.components)
                  | list
                )
            )
          }}

    - name: Render px-versions ConfigMap (filtered)
      ansible.builtin.copy:
        dest: "{{ configmap_out }}"
        mode: "0644"
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ configmap_name }}
            namespace: {{ namespace }}
          data:
            versions: |
              version: {{ px_manifest.version }}
              components:
          {% for k, v in filtered_components.items() %}
                {{ k }}: {{ v }}
          {% endfor %}

    - name: Build additionalImages list (prepend docker.io when no registry host)
      ansible.builtin.set_fact:
        additional_images: >-
          {{
            filtered_components.values()
            | map('regex_replace', '^(?!([^/]*[\.:][^/]*|localhost)/)(.+)$', 'docker.io/\2')
            | list
          }}

    - name: Render oc-mirror ImageSetConfiguration (filtered)
      ansible.builtin.copy:
        dest: "{{ imageset_out }}"
        mode: "0644"
        content: |
          kind: ImageSetConfiguration
          apiVersion: {{ imageset_api_version }}
          mirror:
            additionalImages:
          {% for img in additional_images %}
              - name: {{ img }}
          {% endfor %}

    - name: Report outputs
      ansible.builtin.debug:
        msg:
          - "Categories selected: {{ selected_categories }}"
          - "Wrote ConfigMap: {{ configmap_out }}"
          - "Wrote ImageSetConfiguration: {{ imageset_out }}"
          - "Image count: {{ additional_images | length }}"
